syntax = "proto3";

package server;

option java_multiple_files = true;

import "generic.proto";

message RegisterServer {
  int32 PluginVersion = 1;
  int32 ServerVersion = 2;
  generic.Os Os = 3;
  generic.Protocol Protocol = 4;
}

message RegistrationResponse {
  bool Succeeded = 1;
  optional string UuidKey = 2;
}

message DisconnectServer {
  optional string UuidKey = 1;
  generic.DisconnectReason Reason = 2;
}