syntax = "proto3";

package movement;

option java_multiple_files = true;

message Px_PlayerMovement {
  string uuid = 1;
  double x = 2;
  double y = 3;
  double z = 4;
  // Not safe to rely on!
  bool ground = 7;
}

message Px_PlayerRotation {
  string uuid = 1;
  float yaw = 2;
  float pitch = 3;
}