syntax = "proto3";

package movement;

option java_multiple_files = true;

message Px_PlayerMovement {
  string uuid = 1;
  double x = 2;
  double y = 3;
  double z = 4;
}

message Px_PlayerRotation {
  string uuid = 1;
  float yaw = 2;
  float pitch = 3;
}

// Not safe to rely on!
message Px_PlayerGround {
  string uuid = 1;
  bool ground = 2;
}